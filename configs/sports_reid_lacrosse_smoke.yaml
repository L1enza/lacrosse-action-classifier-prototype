video:
  max_seconds: 30.0

detector:
  backend: ultralytics
  confidence_threshold: 0.15
  weights: yolo11n.pt
  device: cpu
  image_size: 640
  use_tracking: false

pose:
  enabled: false

legibility:
  enabled: false

super_resolution:
  enabled: false
  opencv:
    player_min_area: 220
    player_max_area_ratio: 0.08
    player_min_height: 22
    player_min_aspect: 0.18
    player_max_aspect: 1.20
    confidence_floor: 0.35

tracker:
  backend: simple_iou
  max_age_frames: 14
  min_iou: 0.03
  max_center_distance: 130.0
  iou_weight: 0.65
  center_weight: 0.35

tracking:
  min_tracklet_observations: 2

team_classifier:
  temperature: 0.13
  unfit_confidence_cap: 0.62
  unknown_color_distance: 0.48

role_filter:
  min_player_likelihood: 0.35
  min_track_duration_sec: 0.20
  edge_margin_pixels: 4
  max_edge_touch_ratio: 0.30
  lower_sideline_y_ratio: 0.965
  upper_sideline_y_ratio: 0.04
  side_sideline_x_ratio: 0.015
  sideline_penalty: 0.15
  referee_min_hue_dist: 35
  gk_min_hue_dist: 50
  min_observations: 1
  gk_require_uniform_kit: false

jersey_ocr:
  backend: template
  run_every_n_frames: 8
  min_confidence: 0.40
  min_height_px: 18
  min_width_px: 14
  upscale_height: 96
  fuzzy_substring_weight: 0.7
  strict_roster: false
  kit_isolate: false
  multi_region: false
  confusable_smooth_strength: 0.0
  min_score: 0.16
  min_margin: 0.035
  score_temperature: 0.08

headshot_matcher:
  enabled: false

body_reid:
  enabled: false

appearance_memory:
  enabled: false

position_prior:
  enabled: false
  default_prior: 0.5
  strength: 0.12

fusion:
  temperature: 0.8
  jersey_missing_neutral: 0.72
  team_missing_neutral: 0.5
  weights:
    team: 2.0
    jersey: 0.2
    headshot: 0.0
    body: 0.0
    position: 0.0
    track: 0.20

assignment:
  identity_confidence_threshold: 1.01
  window_sec: 1.0
  step_sec: 0.5

visualization:
  likely_threshold: 1.01
  max_seconds: 30.0
  browser_compatible_mp4: true
  h264_crf: 22
  min_player_likelihood: 0.35
  min_track_duration_sec: 0.25
  min_jersey_display_confidence: 0.40
  peak_lock_threshold: 0.85
  peak_lock_min_count: 4
  longer_lock_min_count: 2
